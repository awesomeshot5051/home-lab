port 443

proto tcp-server

dev tun1

ca ca.crt

cert server.crt

key server.key

dh dh.pem

tls-auth ta.key 0

server 10.9.0.0 255.255.255.0



topology subnet

client-config-dir /etc/openvpn/server/ccd

ifconfig-pool-persist ipp-tcp.txt

push "route 192.168.0.0 255.255.255.0"

push "dhcp-option DNS 192.168.0.1"

push "dhcp-option DOMAIN england"

keepalive 10 60

cipher AES-256-CBC

auth SHA256

user nobody

group nogroup

persist-key

persist-tun

status /var/log/openvpn/openvpn-status-tcp.log

verb 3
